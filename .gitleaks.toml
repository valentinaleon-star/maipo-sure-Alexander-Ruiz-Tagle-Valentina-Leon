title = "Gitleaks - Planta Maipo Sur"

[extend]
useDefault = true

[[rules]]
id = "plc-password-fabrica"
description = "Contrasena de fabrica del PLC escrita en el codigo"
regex = '''password:\s*["']?admin123["']?'''
tags = ["password", "plc"]

[[rules]]
id = "password-hardcoded-generic"
description = "Contrasena hardcoded generica"
regex = '''(password|passwd|pwd)\s*[:=]\s*["'][^"']{4,}["']'''
tags = ["password", "hardcoded"]
